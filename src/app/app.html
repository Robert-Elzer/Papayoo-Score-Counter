<main class="min-h-screen">

<div class="main-container">
  <app-start-screen *ngIf="currentView === 'start'" (navigate)="setView($event)"></app-start-screen>
  <app-add-player *ngIf="currentView === 'input'" (navigate)="setView($event)"></app-add-player>
  <app-score-table *ngIf="currentView === 'score'" (navigate)="setView($event)"></app-score-table>
  <app-results *ngIf="currentView === 'results'" (navigate)="setView($event)"></app-results>
</div>
  
</main>
