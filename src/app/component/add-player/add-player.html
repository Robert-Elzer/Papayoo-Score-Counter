<section class=" relative min-w-full min-h-screen p-4 overflow-y-auto bg-blue-900">

    <div class="fixed inset-0 z-0 flex items-center justify-center pointer-events-none p-6">
        <img src="images/Papayoo.webp"
        class="max-w-md w-full opacity-15 filter brightness-110"
        alt="Papayoo Logo">
    </div>

    <form (ngSubmit)="addPlayer()" class="flex flex-col gap-4">
        <label class="text-white text-xl text-center">Enter Player Name</label>

        <input 
        type="text"
        name="playerName"
        [(ngModel)]="playerName"
        class="border-solid border-2 border-black rounded-lg text-black block m-auto p-2"
        required>

        <div class="flex justify-around">
            <button type="button" (click)="cancel()" class="border-solid border-2 border-black rounded-lg text-white bg-amber-400 p-2">
                Cancel
            </button>
            <button type="submit"  class= "border-solid border-2 border-black rounded-lg text-white bg-amber-400 p-2">
                Confirm Player
            </button>
        </div>
    </form>

    <hr class="border-white/30">

    <div class="flex flex-col gap-2 max-w-xs mx-auto w-full">
        <h3 class="text-white text-lg font-bold text-center">Current Players</h3>

        <div *ngFor="let player of gameService.players; let i = index"
        class="flex justify-between items-center bg-white/80 backdrop-blur-sm rounded-lg p-3 border-2 border-black">
            <span>{{ player.name }}</span>

            <button
            type="button"
            (click)="removePlayer(i)"
            class="bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center border-2 border-black hover:bg-red-600 active:scale-95 transition-transform"
            title="Remove Player">
                X
            </button>
        </div>

        <p *ngIf="gameService.players.length === 0"
            class="text-white italic text-center opacity-80">
            No Players added yet!
        </p>
    </div>
</section>
